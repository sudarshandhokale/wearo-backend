services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: wearo_backend_test
    ports:
      - "25432:5432"
  redis:
    image: redis:7
    ports:
      - "26379:6379"
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    command: bash -c "bundle exec rails db:test:prepare && bundle exec rspec && bundle exec rubocop && bundle exec brakeman"
    depends_on:
      - db
      - redis
    environment:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:password@db:5432/wearo_backend_test
      SECRET_KEY_BASE: test_secret_key_base
      DEVISE_JWT_SECRET_KEY: test_jwt_secret_key
      REDIS_URL: redis://redis:6379/0
